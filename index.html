<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fold Flip Effect</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="intro">
      <p class="eyebrow">A Dependency-Free Effect</p>
      <h1>Fold Flip</h1>
      <p>A two-sided fold/flip effect built with plain HTML, CSS, and JavaScript. Tap the panel to open it, tap again to fold it back.</p>
    </div>

    <div class="fold-flip" id="fold">
      <div class="fold-flip__glow"></div>
      <div class="fold-flip__stage">
        <!--
          Both faces are real <img> elements written directly into the
          page, not inserted by JavaScript, so the browser starts loading
          both immediately. There's only ever this one panel — opening and
          closing just rotates it 180° back and forth.
        -->
        <div class="fold-flip__panel">
          <div class="fold-flip__face fold-flip__face--front"><img src="assets/front.webp" alt=""></div>
          <div class="fold-flip__face fold-flip__face--back"><img src="assets/back.webp" alt=""></div>
        </div>
        <button class="fold-flip__zone" aria-label="Open or close"></button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
